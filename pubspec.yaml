name: saydaliati
description: "Find the nearest open pharmacy around you. Powered by OpenStreetMap."
publish_to: 'none'
version: 1.4.0+5

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Maps (OpenStreetMap) & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1

  # Networking
  http: ^1.2.2

  # Utilities
  url_launcher: ^6.3.0
  intl: ^0.20.2
  shared_preferences: ^2.3.2

  # UI
  cupertino_icons: ^1.0.8
  share_plus: ^13.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
